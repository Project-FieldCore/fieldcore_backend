openapi: 3.0.3
info:
  title: FieldOps API
  description: FieldCore backend — Sprint 1 skeleton
  version: 1.0.0-skeleton
servers:
  - url: http://localhost:8080
    description: Local dev
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required: [timestamp, status, code, message, path]
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        code:
          type: string
        message:
          type: string
        path:
          type: string
        requestId:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    InspectionStatus:
      type: string
      enum:
        - DRAFT
        - ASSIGNED
        - IN_PROGRESS
        - SUBMITTED
        - IN_REVIEW
        - APPROVED
        - RETURNED
        - REJECTED
        - CANCELLED
paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      security: []
      summary: Login (Sprint 2)
      responses:
        '501':
          description: Not implemented (Sprint 1 skeleton)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      security: []
      summary: Refresh token (Sprint 2)
      responses:
        '501':
          description: Not implemented
  /api/v1/users:
    get:
      tags: [Users]
      summary: List users (ADMIN)
      responses:
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/clients:
    get:
      tags: [Clients]
      summary: Placeholder
      responses:
        '401':
          description: Unauthorized
  /api/v1/sites:
    get:
      tags: [Sites]
      summary: Placeholder
      responses:
        '401':
          description: Unauthorized
  /api/v1/inspections:
    get:
      tags: [Inspections]
      summary: Placeholder
      responses:
        '401':
          description: Unauthorized
